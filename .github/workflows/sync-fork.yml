name: Sync to Nurahmed Fork

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    name: Sync to nurahmed123
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push to nurahmed123 fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
        run: |
          git remote add fork "https://x-access-token:${FORK_TOKEN}@github.com/nurahmed123/personal_portfolio.git"

          git push fork main:main --force
